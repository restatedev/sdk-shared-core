name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test with features '${{ matrix.features }}' (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04 ]
        features:
          # All features
          - "all"
          # Test all without object store
          - "request_identity,sha2_random_seed,rust_crypto,sql,tunnel"
          # Only request identity (used by some sdks)
          - "request_identity,rust_crypto"
          # No features (default)
          - ""
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          rustflags: ""

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Install nextest
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: nextest

      - name: Setup just
        uses: extractions/setup-just@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests
        run: just --set features "${{ matrix.features }}" verify

  build-smoke-test:
    name: Build only (${{ matrix.target }}, features '${{ matrix.features }}')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - os: macos-14
            target: aarch64-apple-darwin
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - os: macos-14
            target: x86_64-apple-darwin
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - os: ubuntu-22.04
            target: wasm32-unknown-unknown
            features: ""
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          target: ${{ matrix.target }}
          rustflags: ""
      - name: Install musl
        if: ${{ endsWith( matrix.target, '-musl' ) }}
        # cc-rs looks for `<arch>-linux-musl-gcc`, which musl-tools does not
        # provide; name its `musl-gcc` for the target.
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Setup just
        uses: extractions/setup-just@v2.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: just --set features "${{ matrix.features }}" build --target ${{ matrix.target }}
