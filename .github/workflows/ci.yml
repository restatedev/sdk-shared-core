name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  ci:
    name: ${{ matrix.cmd }} (${{ matrix.target || matrix.os }}, features '${{ matrix.features }}')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Full verification on the host target ---
          # All features
          - cmd: verify
            os: ubuntu-22.04
            features: all
          # All without object store
          - cmd: verify
            os: ubuntu-22.04
            features: request_identity,sha2_random_seed,rust_crypto,sql,tunnel
          # Only request identity (used by some sdks)
          - cmd: verify
            os: ubuntu-22.04
            features: request_identity,rust_crypto
          # No features (default)
          - cmd: verify
            os: ubuntu-22.04
            features: ""

          # --- Build only, cross targets ---
          - cmd: build
            os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - cmd: build
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - cmd: build
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - cmd: build
            os: macos-latest
            target: aarch64-apple-darwin
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - cmd: build
            os: macos-latest
            target: x86_64-apple-darwin
            features: request_identity,sha2_random_seed,rust_crypto,sql,object_store
          - cmd: build
            os: ubuntu-22.04
            target: wasm32-unknown-unknown
            features: ""
    env:
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          components: clippy
          target: ${{ matrix.target }}
          rustflags: ""

      - name: Install musl
        if: ${{ endsWith(matrix.target, '-musl') }}
        # cc-rs looks for `<arch>-linux-musl-gcc`, which musl-tools does not
        # provide; name its `musl-gcc` for the target.
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "$GITHUB_ENV"
        env:
          TARGET: ${{ matrix.target }}

      - name: Install protoc
        uses: $/.github/actions/install-protoc

      - name: Install nextest
        if: ${{ matrix.cmd == 'verify' }}
        uses: taiki-e/install-action@v2.87.31
        with:
          tool: nextest

      - name: Setup just
        uses: extractions/setup-just@v4.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run just ${{ matrix.cmd }}
        run: just --set features "${{ matrix.features }}" ${{ matrix.target && format('--set target {0}', matrix.target) || '' }} ${{ matrix.cmd }}
