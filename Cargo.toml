[package]
name = "restate-sdk-shared-core"
version = "7.0.3"
edition = "2021"
description = "SDK Shared core"
license = "MIT"
repository = "https://github.com/restatedev/sdk-shared-core"

[features]
default = []
request_identity = ["dep:jsonwebtoken", "dep:bs58"]
sha2_random_seed = ["dep:sha2"]
# jsonwebtoken crypto backend pass-through. Enable exactly one alongside
# request_identity (or call jsonwebtoken's CryptoProvider::install_default yourself).
rust_crypto = ["jsonwebtoken?/rust_crypto"]
aws_lc_rs = ["jsonwebtoken?/aws_lc_rs"]
tracing_pretty = ["dep:tracing-subscriber"]
# `http` was an implicit feature of the optional `http` dependency. Referencing
# that dependency with `dep:` (below, via `tunnel`) suppresses the implicit
# feature, so it is declared explicitly here to keep `#[cfg(feature = "http")]`
# (src/headers.rs) and any external `features = ["http"]` working unchanged.
http = ["dep:http"]

# Embedded relay-tunnel receiver (see docs/relay-receiver-in-shared-core.md).
# OFF by default so the crate stays strictly sans-IO and WASM-compilable: none
# of these deps enter the default dependency graph. ON pulls in the relay stack
# (src/relay/) + a tokio runtime so the crate can act as a relay receiver,
# bridging each forwarded stream to a local HTTP/2 server over a loopback socket.
tunnel = [
  "dep:tokio",
  "dep:h2",
  "http",
  "dep:tokio-rustls",
  "dep:rustls-pki-types",
  "dep:async-trait",
  "dep:serde_json",
]

[dependencies]
thiserror = "2.0"
prost = "0.14"
bytes = "1.10"
bytes-utils = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
pastey = "0.2"
strum = { version = "0.27", features = ["derive"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }

sha2 = { version = "0.11.0", optional = true }

bs58 = { version = "0.5", optional = true }
jsonwebtoken = { version = "10.3", default-features = false, optional = true }

http = { version = "1.3", optional = true }

# --- `tunnel` feature deps (all optional; absent from the default/WASM graph) ---
tokio = { version = "1", optional = true, features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
h2 = { version = "0.4", optional = true }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
serde_json = { version = "1", optional = true }

[dev-dependencies]
googletest = "0.11"
test-log = { version = "0.2", default-features = false, features = ["trace", "color"] }
assert2 = "0.4.0"
prost-build = "0.14"
rstest = "0.26.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
