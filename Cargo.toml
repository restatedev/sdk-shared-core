[package]
name = "restate-sdk-shared-core"
version = "8.4.0"
edition = "2021"
description = "SDK Shared core"
license = "MIT"
repository = "https://github.com/restatedev/sdk-shared-core"

[features]
default = []
request_identity = ["dep:jsonwebtoken", "dep:bs58"]
sha2_random_seed = ["dep:sha2"]
# jsonwebtoken (and, with `tunnel`, rustls) crypto backend pass-through. Enable exactly one
# alongside request_identity (or call jsonwebtoken's CryptoProvider::install_default yourself).
# When both are enabled, rust_crypto is selected deterministically.
rust_crypto = ["jsonwebtoken?/rust_crypto", "rustls?/ring"]
aws_lc_rs = ["jsonwebtoken?/aws_lc_rs", "rustls?/aws_lc_rs"]
tracing_pretty = ["dep:tracing-subscriber"]
http = ["dep:http"]
# Restate Cloud keys (`rstcloudv1_…`): parsing and derivations only, bs58 only.
cloud_keys = ["dep:bs58"]
# The in-process Restate Cloud tunnel engine and its configuration. Requires a crypto
# backend (rust_crypto or aws_lc_rs).
tunnel = [
    "cloud_keys",
    "request_identity",
    "http",
    "dep:futures-util",
    "dep:hickory-resolver",
    "dep:hostname",
    "dep:http-body",
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:rand",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:socket2",
    "dep:tokio",
    "tokio/macros",
    "tokio/net",
    "tokio/sync",
    "tokio/time",
    "dep:tokio-rustls",
    "dep:tokio-util",
    "dep:uuid",
]

# Sessions: an object's SQLite-compatible database kept in its Restate state.
# Not for wasm32: the page cache's disk tier (foyer) runs on tokio.
#
# `sql`: the `sql::Database`, SQL on the `state`, the database's file and its
# records over a key/value store the SDK implements, each commit flushed with
# the host's records (`src/sql/README.md`, `src/state/README.md`). What is
# public is what the SDK's host needs: the state's own API is private.
sql = [
    "dep:futures",
    "dep:parking_lot",
    "dep:zstd-safe",
    "dep:foyer",
    "dep:foyer-common",
    "dep:foyer-memory",
    "dep:foyer-storage",
    "dep:foyer-tokio",
    "dep:tokio",
    "tokio/rt-multi-thread",
    "dep:turso_core",
    # Encryption is off, so aegis is never called: its pure-Rust backend spares
    # every SDK compiling the bundled C sources with whatever toolchain it has.
    "turso_core/pure-rust-crypto",
]
# Internal, for the benchmarks in `benches/` (hence the `__`: no API
# stability): the state's in-memory stores, fault injection and latency
# simulator, which tests always have.
__bench = ["sql"]
# Checkpoints' packs in an object store, L1 (`src/state/l1.rs`):
# `state::ObjectStoreL1` names one from a URL (`from_url`) or the environment
# (`from_env`, `RESTATE_SQL_OBJECT_STORE`), and gives each database its own
# `state::ObjectStoreBlobs`, for `sql::Open::checkpoints`. A directory
# (`file://`) always; each cloud provider with its own feature below.
object_store = ["sql", "dep:object_store", "object_store/fs", "dep:url", "dep:sha2"]
# S3, and what speaks its API (MinIO, R2, ...): `s3://`, credentials from `AWS_*`.
object_store_aws = ["object_store", "object_store/aws"]
# Google Cloud Storage: `gs://`, credentials from `GOOGLE_*`.
object_store_gcp = ["object_store", "object_store/gcp"]
# Azure Blob Storage: `az://`, credentials from `AZURE_*`.
object_store_azure = ["object_store", "object_store/azure"]

[dependencies]
thiserror = "2.0"
prost = "0.14"
bytes = "1.10"
bytes-utils = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"], optional = true }
pastey = "0.2"
strum = { version = "0.27", features = ["derive"] }
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }

sha2 = { version = "0.11.0", optional = true }

bs58 = { version = "0.5", optional = true }
jsonwebtoken = { version = "10.3", default-features = false, optional = true }

http = { version = "1.3", optional = true }

# Sessions (features `sql`, `object_store*`, `__bench`).
turso_core = { version = "=0.8.2", default-features = false, features = ["fs", "uuid", "json"], optional = true }
futures = { version = "0.3", optional = true }
# The engine retains an owned schema lock across open-time I/O. Allow that
# guard to move with the host future between executor threads, without a worker.
parking_lot = { version = "0.12", features = ["send_guard"], optional = true }
# Pages: zstd frames, a delta against the page before as the reference prefix.
zstd-safe = { version = "7.2", default-features = false, features = ["std"], optional = true }
# Pinned with its subcrates (which foyer itself takes as `^0.22.3`): 0.22.4 to
# 0.22.6 print a debug line to stdout whenever a file device opens. No
# Cargo.lock is committed, so the pins are here.
foyer = { version = "=0.22.3", optional = true }
foyer-common = { version = "=0.22.3", optional = true }
foyer-memory = { version = "=0.22.3", optional = true }
foyer-storage = { version = "=0.22.3", optional = true }
foyer-tokio = { version = "=0.22.3", optional = true }
tokio = { version = "1.49", default-features = false, features = ["rt"], optional = true }
object_store = { version = "0.14", optional = true, default-features = false }
url = { version = "2.5", optional = true }

# tunnel
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"], optional = true }
hostname = { version = "0.4", optional = true }
http-body = { version = "1.0", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.8", default-features = false, features = ["server", "http2"], optional = true }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"], optional = true }
rand = { version = "0.8", optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }
socket2 = { version = "0.6", optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["rt"], optional = true }
uuid = { version = "1.20", features = ["v4"], optional = true }

[dev-dependencies]
googletest = "0.11"
test-log = { version = "0.2", default-features = false, features = ["trace", "color"] }
assert2 = "0.4.0"
prost-build = "0.14"
rstest = "0.26.1"
ed25519-dalek = { version = "2", features = ["pkcs8", "rand_core"] }
rand = "0.8"
hyper = { version = "1.8", default-features = false, features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
tokio = { version = "1.49", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tokio-stream = { version = "0.1", default-features = false }

# Sessions benchmarks (`benches/README.md`): standalone entry points, on the
# simulated stores.
[[bench]]
name = "amplification"
harness = false
required-features = ["sql", "__bench"]

[[bench]]
name = "small_databases"
harness = false
required-features = ["sql", "__bench"]

[[bench]]
name = "flush_costs"
harness = false
required-features = ["sql", "__bench"]

[[bench]]
name = "read_latency"
harness = false
required-features = ["sql", "__bench"]

[[bench]]
name = "cache_cpu"
harness = false
required-features = ["sql", "__bench"]
